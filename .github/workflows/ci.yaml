name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-linux:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    steps:
      - name: Install deps
        run: dnf install -y gcc make cargo golang cbindgen pkg-config openssl-devel git-core

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - name: Clone and install arapuca
        run: |
          git clone --depth 1 https://github.com/sergio-correia/arapuca.git /tmp/arapuca
          cd /tmp/arapuca
          make package
          make install PREFIX=/usr/local
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig" >> $GITHUB_ENV

      - name: Build
        run: CGO_ENABLED=1 go build ./...

      - name: Test
        run: CGO_ENABLED=1 go test -v ./...

      - name: Vet
        run: CGO_ENABLED=1 go vet ./...

      - name: Format check
        run: |
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out

      - name: Module tidy check
        run: |
          cp go.mod go.mod.orig
          go mod tidy
          diff go.mod.orig go.mod

  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version-file: go.mod

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable

      - name: Install cbindgen
        run: cargo install cbindgen --locked

      - name: Clone and install arapuca
        run: |
          git clone --depth 1 https://github.com/sergio-correia/arapuca.git /tmp/arapuca
          cd /tmp/arapuca
          make package
          make install PREFIX=$HOME/.local
          echo "PKG_CONFIG_PATH=$HOME/.local/lib/pkgconfig" >> $GITHUB_ENV

      - name: Build
        run: CGO_ENABLED=1 go build ./...

      - name: Test
        run: CGO_ENABLED=1 go test -v ./...

      - name: Vet
        run: CGO_ENABLED=1 go vet ./...

      - name: Format check
        run: |
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out
